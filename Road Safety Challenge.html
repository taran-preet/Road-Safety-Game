<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Road Safety Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #e4e6e1;
        --surface: #ffffff;
        --surface-2: #f0f1ec;
        --ink: #1c2025;
        --ink-2: #555c64;
        --line: #cdd1c9;
        --blue: #1d4f91;
        --green: #0c6b44;
        --amber: #f2b705;
        --ok: #1c9a55;
        --bad: #d2423b;
        --asphalt: #2b3036;
        --shadow:
          0 1px 2px rgba(20, 25, 30, 0.06),
          0 14px 32px -18px rgba(20, 25, 30, 0.35);
        --focus: #f2b705;
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #1e2227;
          --surface: #272c33;
          --surface-2: #2f353d;
          --ink: #eef0eb;
          --ink-2: #a5acb4;
          --line: #3a414a;
          --shadow:
            0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 40px -20px rgba(0, 0, 0, 0.7);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #1e2227;
        --surface: #272c33;
        --surface-2: #2f353d;
        --ink: #eef0eb;
        --ink-2: #a5acb4;
        --line: #3a414a;
        --shadow:
          0 1px 2px rgba(0, 0, 0, 0.3), 0 18px 40px -20px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          "Overpass",
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        cursor: pointer;
        color: inherit;
      }
      button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }
      h1,
      h2 {
        margin: 0;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
      }

      /* ---------- Home ---------- */
      .home {
        max-width: 1160px;
        margin: 0 auto;
        padding: clamp(20px, 4vw, 48px) clamp(16px, 4vw, 40px) 40px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: var(--ink-2);
        font-size: 0.95rem;
      }
      .brand-mark {
        width: 30px;
        height: 30px;
        display: inline-flex;
      }
      .brand-mark svg {
        width: 100%;
        height: 100%;
      }
      .hero {
        padding: clamp(18px, 4vw, 40px) 0 clamp(24px, 4vw, 40px);
      }
      .hero h1 {
        margin-top: clamp(24px, 5vw, 56px);
        font-size: clamp(2.7rem, 8.4vw, 6rem);
        font-weight: 900;
        letter-spacing: -0.035em;
        line-height: 0.92;
        white-space: nowrap;
      }
      .tagline {
        margin-top: 18px;
        font-size: clamp(1.25rem, 2.6vw, 1.7rem);
        font-weight: 800;
        letter-spacing: -0.01em;
      }
      .lede {
        margin-top: 8px;
        color: var(--ink-2);
        font-size: clamp(1rem, 1.6vw, 1.15rem);
        max-width: 52ch;
      }

      .roadway {
        position: relative;
        background: #2b3036;
        border-radius: 26px;
        padding: clamp(18px, 3.5vw, 44px);
        overflow: hidden;
        background-image: linear-gradient(#2b3036, #2b3036);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
      }
      .roadway::before,
      .roadway::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 4px;
        background: #f2b705;
        opacity: 0.9;
      }
      .roadway::before {
        top: 12px;
      }
      .roadway::after {
        bottom: 12px;
      }
      .lane-line {
        position: absolute;
        left: -40px;
        right: -40px;
        top: 50%;
        height: 6px;
        margin-top: -3px;
        background: repeating-linear-gradient(
          90deg,
          #fff 0 46px,
          transparent 46px 86px
        );
        opacity: 0.75;
        animation: lane 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      @keyframes lane {
        from {
          transform: translateX(-260px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 0.75;
        }
      }
      .signs {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(16px, 3vw, 36px);
      }
      .sign {
        border-radius: 20px;
        padding: 7px;
        box-shadow: 0 22px 40px -22px rgba(0, 0, 0, 0.8);
        animation: rise 0.7s 0.25s cubic-bezier(0.2, 0.7, 0.2, 1) both;
      }
      .sign-green {
        animation-delay: 0.38s;
      }
      @keyframes rise {
        from {
          transform: translateY(18px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .sign-blue {
        background: var(--blue);
      }
      .sign-green {
        background: var(--green);
      }
      .sign-face {
        height: 100%;
        border: 3px solid #fff;
        border-radius: 15px;
        padding: clamp(14px, 2vw, 22px);
        display: flex;
        flex-direction: column;
        gap: 18px;
        color: #fff;
      }
      .illo {
        width: 100%;
        height: auto;
        display: block;
        border-radius: 10px;
      }
      .sign-copy h2 {
        font-size: clamp(1.45rem, 2.6vw, 2rem);
        font-weight: 900;
      }
      .sign-copy p {
        margin-top: 8px;
        opacity: 0.9;
        max-width: 42ch;
      }
      .sign-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .sign-meta span {
        font-size: 0.85rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
      }
      .sign-btn {
        margin-top: auto;
        align-self: flex-start;
        background: #fff;
        border: 0;
        border-radius: 12px;
        padding: 13px 22px;
        font-weight: 800;
        font-size: 1.02rem;
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .sign-blue .sign-btn {
        color: var(--blue);
      }
      .sign-green .sign-btn {
        color: var(--green);
      }
      .sign-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 18px -8px rgba(0, 0, 0, 0.6);
      }
      .sign-btn:active {
        transform: translateY(0);
      }
      .home-foot {
        margin-top: 22px;
        color: var(--ink-2);
        font-size: 0.95rem;
      }
      @media (max-width: 760px) {
        .signs {
          grid-template-columns: 1fr;
        }
        .lane-line {
          display: none;
        }
        .sign-btn {
          align-self: stretch;
          text-align: center;
        }
      }

      /* ---------- Game header ---------- */
      .game-page {
        min-height: 100%;
      }
      .game-header {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 40;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .gh-inner {
        max-width: 1160px;
        margin: 0 auto;
        padding: 10px clamp(12px, 3vw, 32px);
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        align-items: center;
        gap: 12px 18px;
      }
      .btn-back {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 14px;
        font-weight: 700;
        white-space: nowrap;
      }
      .btn-back:hover {
        border-color: var(--ink-2);
      }
      .gh-title {
        font-weight: 800;
        font-size: 1.05rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gh-stats {
        display: flex;
        gap: 6px;
      }
      .stat {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 4px 12px 3px;
        min-width: 84px;
      }
      .stat-label {
        font-size: 0.72rem;
        color: var(--ink-2);
        font-weight: 600;
        white-space: nowrap;
      }
      .stat-val {
        font-weight: 900;
        font-size: 1.12rem;
        font-variant-numeric: tabular-nums;
        line-height: 1.2;
        animation: pop 0.35s ease;
      }
      .stat.ok .stat-val {
        color: var(--ok);
      }
      .stat.bad .stat-val {
        color: var(--bad);
      }
      @keyframes pop {
        0% {
          transform: scale(1.35);
        }
        100% {
          transform: none;
        }
      }
      .gh-actions {
        display: flex;
        gap: 8px;
      }
      .btn-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        border: 1px solid var(--line);
        background: var(--surface);
        font-weight: 900;
        font-size: 1.05rem;
      }
      .btn-submit {
        height: 42px;
        padding: 0 22px;
        border-radius: 10px;
        border: 0;
        background: var(--ink);
        color: var(--bg);
        font-weight: 800;
      }
      .btn-submit.ready {
        background: var(--ok);
        color: #fff;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(28, 154, 85, 0.55);
        }
        50% {
          box-shadow: 0 0 0 9px rgba(28, 154, 85, 0);
        }
      }
      @media (max-width: 860px) {
        .gh-inner {
          grid-template-columns: auto 1fr auto;
        }
        .gh-title {
          display: none;
        }
        .gh-stats {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        .gh-stats .stat {
          flex: 1;
          min-width: 0;
        }
        .gh-actions {
          grid-column: 3;
        }
      }
      @media (max-width: 400px) {
        .stat {
          padding: 4px 8px 3px;
        }
        .stat-label {
          font-size: 0.66rem;
        }
        .btn-back {
          padding: 8px 10px;
        }
      }

      /* ---------- Game body ---------- */
      .game-body {
        max-width: 1160px;
        margin: 0 auto;
        padding: clamp(16px, 3vw, 28px) clamp(12px, 3vw, 32px) 40px;
      }
      .game-intro {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px 28px;
        flex-wrap: wrap;
        margin-bottom: 18px;
      }
      .game-intro h1 {
        font-size: clamp(1.8rem, 4vw, 2.7rem);
        font-weight: 900;
      }
      .lead {
        margin-top: 8px;
        font-size: 1.05rem;
        max-width: 60ch;
      }
      .points-note {
        margin-top: 8px;
        color: var(--ink-2);
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .pts {
        display: inline-block;
        background: color-mix(in srgb, var(--ok) 16%, transparent);
        color: var(--ok);
        font-weight: 900;
        border-radius: 7px;
        padding: 1px 8px;
      }
      .legend {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        max-width: 560px;
      }
      .legend li {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px 4px 6px;
        font-size: 0.84rem;
        color: var(--ink-2);
      }
      .legend strong {
        color: var(--ink);
        font-weight: 700;
      }
      .legend-dot {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        flex: none;
      }
      .k-car {
        background: #7d8792;
      }
      .k-ev {
        background: #13a08a;
      }
      .k-accessible {
        background: #1d4fd8;
      }
      .k-moto {
        background: #ee7a1c;
      }
      .k-van {
        background: #f1c233;
      }

      .board-wrap {
        width: 100%;
      }
      .board {
        position: relative;
        width: 100%;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: var(--shadow);
        background: #454b53;
        touch-action: pan-y;
      }
      .board-inner {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 0 0;
      }
      .scene {
        position: absolute;
        inset: 0;
        display: block;
      }
      .board-foot {
        margin-top: 12px;
        color: var(--ink-2);
        font-size: 0.92rem;
      }

      .veh {
        position: absolute;
        left: 0;
        top: 0;
        transform-origin: 50% 50%;
        transition:
          transform 0.42s cubic-bezier(0.25, 0.8, 0.3, 1.1),
          filter 0.2s;
        filter: drop-shadow(0 3px 2px rgba(0, 0, 0, 0.35));
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        z-index: 5;
      }
      .veh svg {
        display: block;
        pointer-events: none;
      }
      .veh.movable {
        cursor: grab;
      }
      .veh.done {
        cursor: default;
        z-index: 3;
      }
      .veh.lifted {
        transition: filter 0.2s;
        cursor: grabbing;
        z-index: 30;
        filter: drop-shadow(0 16px 14px rgba(0, 0, 0, 0.45))
          drop-shadow(0 0 10px rgba(242, 183, 5, 0.55));
      }
      .veh.flash-ok {
        filter: drop-shadow(0 0 14px rgba(40, 220, 120, 0.95))
          drop-shadow(0 3px 2px rgba(0, 0, 0, 0.35));
      }
      .veh.flash-bad {
        filter: drop-shadow(0 0 14px rgba(255, 70, 60, 0.95))
          drop-shadow(0 3px 2px rgba(0, 0, 0, 0.35));
      }
      .board-inner.dragging .veh:not(.lifted) {
        pointer-events: none;
      }
      .slot-hint {
        position: absolute;
        border-radius: 6px;
        border: 3px dashed rgba(70, 230, 140, 0.95);
        background: rgba(40, 200, 110, 0.16);
        animation: hint 1s ease-in-out infinite alternate;
        pointer-events: none;
        z-index: 2;
      }
      .slot-hint.over-ok {
        border-style: solid;
        background: rgba(40, 200, 110, 0.38);
        animation: none;
      }
      .slot-hint.over-bad {
        border: 3px solid rgba(255, 90, 80, 0.95);
        background: rgba(255, 70, 60, 0.3);
        animation: none;
      }
      @keyframes hint {
        from {
          opacity: 0.55;
        }
        to {
          opacity: 1;
        }
      }
      .check {
        position: absolute;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: #1c9a55;
        color: #fff;
        font-weight: 900;
        display: grid;
        place-items: center;
        font-size: 15px;
        box-shadow:
          0 0 0 3px #fff,
          0 4px 10px rgba(0, 0, 0, 0.35);
        z-index: 6;
        animation: checkIn 0.4s cubic-bezier(0.3, 1.6, 0.5, 1) both;
        pointer-events: none;
      }
      @keyframes checkIn {
        from {
          transform: scale(0);
        }
        to {
          transform: none;
        }
      }
      .why-chip {
        position: absolute;
        transform: translate(-50%, -50%);
        background: rgba(190, 40, 35, 0.94);
        color: #fff;
        font-size: 12.5px;
        font-weight: 700;
        white-space: nowrap;
        padding: 3px 9px 2px;
        border-radius: 999px;
        pointer-events: none;
        z-index: 8;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3);
      }
      .warn-dot {
        position: absolute;
        width: 26px;
        height: 26px;
        margin: -13px 0 0 -13px;
        border-radius: 50%;
        background: #d2423b;
        color: #fff;
        font-weight: 900;
        font-size: 16px;
        display: grid;
        place-items: center;
        box-shadow: 0 0 0 3px #fff;
        z-index: 8;
        pointer-events: none;
        animation: blink 1.6s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          transform: scale(0.82);
        }
      }
      .board-inner.dragging .why-chip,
      .board-inner.dragging .warn-dot {
        opacity: 0.35;
      }
      .float {
        position: absolute;
        transform: translate(-50%, -50%);
        font-weight: 900;
        font-size: 26px;
        white-space: nowrap;
        pointer-events: none;
        z-index: 40;
        padding: 4px 14px 2px;
        border-radius: 12px;
        animation: floatUp 1.1s ease-out forwards;
      }
      .float.ok {
        background: #1c9a55;
        color: #fff;
      }
      .float.bad {
        background: #d2423b;
        color: #fff;
      }
      @keyframes floatUp {
        0% {
          opacity: 0;
          transform: translate(-50%, -30%) scale(0.7);
        }
        15% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1.05);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(-50%, -150%);
        }
      }

      /* ---------- Sorting ---------- */
      .sort-board {
        background: #cfd3c9;
      }
      .sort-ground {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse at 50% 55%,
            rgba(255, 255, 255, 0.35),
            transparent 60%
          ),
          repeating-linear-gradient(
            0deg,
            rgba(0, 0, 0, 0.035) 0 2px,
            transparent 2px 28px
          ),
          repeating-linear-gradient(
            90deg,
            rgba(0, 0, 0, 0.035) 0 2px,
            transparent 2px 28px
          ),
          #d5d8cf;
      }
      .challenge {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 6px 12px;
      }
      .challenge-k {
        font-weight: 700;
        color: var(--ink-2);
      }
      .challenge-t {
        font-weight: 900;
        font-size: clamp(1.25rem, 2.4vw, 1.6rem);
        letter-spacing: -0.01em;
        border-bottom: 4px solid var(--topic);
        line-height: 1.15;
        animation: pop 0.45s ease;
      }
      .btn-secondary.small {
        padding: 9px 16px;
        font-size: 0.92rem;
      }
      .pail {
        position: absolute;
        z-index: 4;
        transition: transform 0.2s;
        pointer-events: none;
      }
      .pail-svg {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
      }
      .pail.over {
        transform: scale(1.07);
      }
      .pail.over::after {
        content: "";
        position: absolute;
        inset: -14px -14px 10px;
        border-radius: 30px;
        border: 4px dashed rgba(28, 154, 85, 0.9);
        animation: hint 0.7s ease-in-out infinite alternate;
      }
      .pail.gulp {
        animation: gulp 0.5s ease;
      }
      .pail.shake {
        animation: shake 0.45s ease;
      }
      @keyframes gulp {
        30% {
          transform: scale(1.1, 0.94);
        }
        60% {
          transform: scale(0.97, 1.04);
        }
      }
      @keyframes shake {
        20%,
        60% {
          transform: translateX(-9px) rotate(-2deg);
        }
        40%,
        80% {
          transform: translateX(9px) rotate(2deg);
        }
      }
      .pile {
        position: absolute;
        left: 0;
        height: 34px;
      }
      .pile span {
        position: absolute;
        top: 0;
        font-size: 30px;
        line-height: 1;
        font-family:
          "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
      }
      .drop-label {
        position: absolute;
        transform: translate(-50%, -50%);
        background: #1c9a55;
        color: #fff;
        font-weight: 800;
        font-size: 17px;
        padding: 5px 14px 3px;
        border-radius: 999px;
        z-index: 6;
        pointer-events: none;
        white-space: nowrap;
      }
      .item {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        background: #fff;
        border-radius: 18px;
        border: 2px solid #e3e5df;
        box-shadow:
          0 2px 0 #c4c8bf,
          0 8px 16px -8px rgba(0, 0, 0, 0.35);
        touch-action: none;
        user-select: none;
